[project]
name = "kalibra-adaptive-engine"
version = "0.1.0"
description = "Kalibra Adaptive Engine: stateless FastAPI service for mastery estimation, exercise generation and verification."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "tenacity>=9.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalibra_engine"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107", "N818"]  # N818: diagram names exceptions with the "Exception" suffix

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["kalibra_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
